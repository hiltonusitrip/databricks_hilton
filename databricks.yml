bundle:
  name: weather-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: target catalog
    default: dev_catalog
  schema:
    description: target schema
    default: bronze
  job_pause_status:
    description: schedule state
    default: PAUSED

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-6a21f5a8-b4b0.cloud.databricks.com/
    variables:
      catalog: dev_catalog
      schema: bronze
      job_pause_status: PAUSED

  test:
    workspace:
      host: https://dbc-adadf338-3987.cloud.databricks.com/
    variables:
      catalog: test_catalog
      schema: bronze
      job_pause_status: PAUSED

  prod:
    workspace:
      host: https://dbc-c382fa4e-0ede.cloud.cloud.databricks.com/
    variables:
      catalog: prod_catalog
      schema: bronze
      job_pause_status: UNPAUSED
